# config/vitrina.yml — presentación de cada pub en la vitrina del aula (provisional, fase 4).
# Solo lo que ninguna fuente dice todavía. En la fase 7 esto pasa al `pub.yml` de cada pub
# (web/docs/plataforma-educativa.md §4.7) y este archivo desaparece.
#   acento: un token de src/styles/tokens.css (nunca un hex).
#   monograma: las letras del colofón del sitio (docs/decisiones.md §1.18): mayúscula y minúscula si el nombre es una
#     palabra (Me, Ns…), dos mayúsculas si son dos (EA del hub). scripts/marca.py las convierte en trazos con Petrona;
#     si cambias uno, corre `python3 scripts/marca.py --aplicar`.
#   nombre (opcional): el nombre visible con tildes, si no se deriva bien de la carpeta.
#   leccion_destacada (opcional): «curso/slug» de la lección que muestra la portada; si falta, se elige sola.
# hub: el sitio de la familia que no es un pub; su URL viene de web/_pubs/pubs.yml (hub.url).
hub:              { nombre: Edison Achalma, area: Hub académico, acento: tinta, monograma: EA }
pubs:
  methodica:          { acento: revista, monograma: Me }
  numerus-scriptum:   { acento: laboratorio, monograma: Ns }
  epsilon-y-beta:     { acento: indigo, monograma: Eb }
  aequilibria:        { acento: cobalto, monograma: Ae }
  optimums:           { acento: petroleo, monograma: Op }
  axiomata:           { acento: pizarra, monograma: Ax }
  pecunia-fluxus:     { acento: musgo, monograma: Pf }
  actus-mercator:     { acento: abeto, monograma: Am }
  res-publica:        { acento: marino, monograma: Rp }
  dialectica-y-mercado: { acento: tinta, monograma: Dm, nombre: Dialéctica y Mercado }
  chaska:             { acento: glaciar, monograma: Ch }
  propaedeutica:      { acento: pizarra, monograma: Pr }   # 12.º sitio (B3, 2026-10-21); pizarra como axiomata hasta que la paleta tenga un acento propio
