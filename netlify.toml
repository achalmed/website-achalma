# netlify.toml — configuración de Netlify de website-achalma (achalmaedison.netlify.app): publica el `_site/` empujado, sin build
# Reproduce lo que hace hoy (web/docs/decisiones.md §4.1): Netlify sirve `_site/` desde git y no ejecuta ningún
# comando; el render es local (`quarto render`) y la puerta R6 (web/scripts/puerta-r6.sh) lo exige antes del push.
[build]
  base = "/"          # la raíz del repo: el sitio tenía `_site` como base en Netlify y los builds fallaban desde 2026-10-04
  publish = "_site"

# Node 22: sin build no se usa, pero Netlify avisaba de que el entorno del sitio estaba en Node 16 (2026-10-21).
[build.environment]
  NODE_VERSION = "22"
